<!DOCTYPE html>
<html>
<head>
  <style>
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .flex-shrink-0 { flex-shrink: 0; }
    .flex-shrink { flex-shrink: 1; }
    .min-w-0 { min-width: 0; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .container { width: 800px; border: 1px solid black; }
    
    .left { background: lightblue; }
    .center { background: lightgreen; }
    .right { background: lightcoral; }
  </style>
</head>
<body>
  <div class="flex items-center justify-between container">
    <div class="flex items-center left flex-shrink min-w-0">
      <div class="min-w-0">
        <h1 class="truncate">TRUONG PTDTBT THCS XA DONG ABCDEF GHIJKL MNOPQR STUVWX YZ</h1>
      </div>
    </div>
    <div class="flex items-center center flex-shrink-0">
      Tong quan | Bao cao | Cai dat | Something else | And more
    </div>
    <div class="flex items-center right flex-shrink-0">
      User Profile | Logout
    </div>
  </div>
</body>
</html>
