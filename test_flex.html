<!DOCTYPE html>
<html>
<head>
  <style>
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    
    .flex-shrink-0 { flex-shrink: 0; }
    .flex-shrink { flex-shrink: 1; }
    .flex-1 { flex: 1 1 0%; }
    .min-w-0 { min-width: 0; }
    
    .overflow-x-auto { overflow-x: auto; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    
    .container { width: 1280px; height: 50px; border: 1px solid black; margin-bottom: 20px;}
    .mobile { width: 375px; }
    
    .left { background: lightblue; padding: 0 10px; }
    .center { background: lightgreen; padding: 0 10px; display: flex; gap: 10px; }
    .right { background: lightcoral; padding: 0 10px; }
    
    .btn { background: white; border: 1px solid gray; padding: 5px 20px; white-space: nowrap; }
  </style>
</head>
<body>
  <h2>Desktop (1280px)</h2>
  <div class="flex items-center justify-between container">
    <div class="flex items-center left flex-shrink-0 min-w-0">
      <div class="min-w-0">
        <h1 class="truncate">TRUONG PTDTBT THCS XA DONG ABCDEF GHIJKL MNOPQR STUVWX YZ</h1>
      </div>
    </div>
    <div class="center flex-1 min-w-0 overflow-x-auto">
      <div class="btn">Tong quan</div>
      <div class="btn">Bao cao si so</div>
      <div class="btn">Bao cao ngay</div>
      <div class="btn">Bao cao thang</div>
      <div class="btn">Bieu do</div>
      <div class="btn">Thong ke</div>
      <div class="btn">Cai dat</div>
    </div>
    <div class="flex items-center right flex-shrink-0">
      User Profile | Logout
    </div>
  </div>

  <h2>Mobile (375px)</h2>
  <div class="flex items-center justify-between container mobile">
    <div class="flex items-center left flex-shrink min-w-0">
      <div class="min-w-0">
        <h1 class="truncate">TRUONG PTDTBT THCS XA DONG ABCDEF GHIJKL MNOPQR STUVWX YZ</h1>
      </div>
    </div>
    <div class="flex items-center right flex-shrink-0">
      User
    </div>
  </div>
</body>
</html>
